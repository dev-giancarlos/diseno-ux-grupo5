<!doctype html>
<html lang="es">
  <head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPC - Aula virtual</title>
    
    <meta property="og:title" content="UPC - Aula virtual">
    <script type="module" crossorigin src="./assets/index-BjfuBgyW.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CUO1hoWJ.css">
    <style>
  /* ---------- Barra derecha «TODOS LOS ANUNCIOS» ---------- */
  .bar{position:fixed;top:0;right:0;height:100dvh;width:48px;display:flex;flex-direction:column;align-items:center;padding:24px 0;background:var(--card, #fff);border-left:1px solid var(--border, #e5e7eb);cursor:pointer;z-index:30}
  .bar:hover{background:#FAFAFA}
  .bar > .ico{width:18px;height:18px;color:var(--accent)}
  .bar-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .bar-text{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--accent);white-space:nowrap}

  /* ---------- Panel retráctil ---------- */
  .panel{position:fixed;top:0;bottom:0;right:48px;width:min(800px,calc(100vw - 248px));background:var(--card, #fff);box-shadow:-8px 0 28px rgba(17,24,39,.15);transform:translateX(calc(100% + 48px));visibility:hidden;transition:transform .3s ease,visibility .3s;overflow-y:auto;z-index:20}
  .panel.open{transform:translateX(0);visibility:visible}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:0 20px;min-height:61px;border-bottom:1px solid var(--border, #e5e7eb)}
  .panel-head h2{font-size:16px;font-weight:600}
  .panel-sum{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:var(--muted-foreground, #6b7280);font-size:12px}
  .unread-count{display:flex;align-items:center;gap:6px;color:var(--orange, #f97316);font-weight:600}
  .unread-count .ico{width:14px;height:14px}
  .ann{position:relative;display:flex;flex-direction:column;gap:5px;padding:10px 20px;border-bottom:1px solid var(--border, #e5e7eb)}
  .ann.unread{background:var(--orange-bg, #fff7ed)}
  .ann.unread::before{content:"";position:absolute;inset:0 auto -1px 0;width:3px;background:var(--orange, #f97316)}
  .ann .top{display:flex;justify-content:space-between;gap:8px;color:var(--muted-foreground, #6b7280);font-size:12px}
  .ann .subj{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600;line-height:1.3}
  .ann .tag{color:var(--orange, #f97316);font-size:10px;white-space:nowrap}
  .ann p{color:var(--muted-foreground, #6b7280);line-height:1.45}
  .panel-foot{padding:20px;color:var(--muted-foreground, #6b7280);font-size:12px}
</style>
  </head>
  <body>
    
    <div id="root"></div>

    <!-- Barra y Panel de Anuncios -->
    <aside class="bar" id="ann-bar" role="button" tabindex="0" aria-expanded="false" aria-controls="ann-panel">
      <svg class="ico" id="bar-chev"><use href="#i-left"/></svg>
      <div class="bar-mid">
        <span class="bar-text">TODOS LOS ANUNCIOS</span>
        <span class="count-badge" id="bar-badge"></span>
      </div>
    </aside>
    
    <section class="panel" id="ann-panel" aria-hidden="true">
      <div class="panel-head">
        <h2>TODOS LOS ANUNCIOS</h2>
        <button type="button" class="outline-button small" id="panel-close"><svg class="ico"><use href="#i-x"/></svg>Cerrar</button>
      </div>
      <div class="panel-sum">
        <span id="ann-sum"></span>
        <span class="unread-count"><svg class="ico"><use href="#i-mail"/></svg><span id="ann-unread"></span></span>
      </div>
      <div id="announcements"></div>
      <p class="panel-foot" id="ann-foot"></p>
    </section>
    
    <script>
      // Aseguramos que corra cuando cargue la data
      window.addEventListener('DOMContentLoaded', () => {
        if (typeof ANUNCIOS !== 'undefined' && typeof curso !== 'undefined') {
          const noLeidos = ANUNCIOS.filter(a => a[4]).length;
          if($("bar-badge")) $("bar-badge").textContent = noLeidos;
          if($("ann-unread")) $("ann-unread").textContent = `${noLeidos} no leídos`;
          if($("ann-sum")) $("ann-sum").textContent = `${ANUNCIOS.length} anuncios · Todos los cursos · Más recientes primero`;
          if($("ann-foot")) $("ann-foot").textContent = `Mostrando ${ANUNCIOS.length} de ${ANUNCIOS.length} anuncios · Recepción hasta el 04/10/2026, 07:30`;
    
          if($("announcements")) {
            $("announcements").innerHTML = ANUNCIOS.map(([id, fecha, asunto, texto, sinLeer]) => `
              <article class="ann ${sinLeer ? "unread" : ""}">
                <div class="top"><span>${curso(id).nombre} · ${curso(id).prof}</span><span>${fecha}</span></div>
                <div class="subj"><span>${asunto}</span>${sinLeer ? '<span class="tag">No leído</span>' : ""}</div>
                <p>${texto}</p>
              </article>`).join("");
          }
    
          let abierto = false;
          function setPanel(open) {
            abierto = open;
            if($("ann-panel")) $("ann-panel").classList.toggle("open", open);
            if($("ann-panel")) $("ann-panel").setAttribute("aria-hidden", !open);
            if($("ann-bar")) $("ann-bar").setAttribute("aria-expanded", open);
            if($("bar-chev")) $("bar-chev").innerHTML = `<use href="#i-${open ? "right" : "left"}"/>`;
          }
          if($("ann-bar")) $("ann-bar").onclick = () => setPanel(!abierto);
          if($("panel-close")) $("panel-close").onclick = () => setPanel(false);
        }
      });
    </script>
  </body>
</html>
